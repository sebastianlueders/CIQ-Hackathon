{
 "version": "v4",
 "files": {
  "train.py": "\"\"\"Single-node LoRA trainer: one search trial = one run of this script.\n\nUsage: python train_lora.py --config trial.json\n\nConfig keys (defaults in DEFAULTS): model, data, out, seq_len, micro_batch, grad_accum,\nlr, warmup_tokens, schedule (constant|cosine), train_tokens, lora_r, lora_alpha,\nlora_dropout, targets, grad_ckpt, eval_every_tokens, seed, resume, save_adapter.\n\nWrites to <out>/: metrics.jsonl (train + eval records), summary.json, and when\nsave_adapter or a later rung needs it, adapter/ + state.pt (resume point).\nEvery record line is also printed as \"RESULT {...}\" so it shows in the Fuzzball log.\n\"\"\"\nimport argparse, json, math, os, time\nimport numpy as np\nimport torch\n\nDEFAULTS = dict(\n    model=\"/models/Qwen/Qwen3-Coder-30B-A3B-Instruct-fused\", data=\"/data/tok/lammps\", out=\"/runs/trial\",\n    seq_len=4096, micro_batch=1, grad_accum=8, lr=2e-4, warmup_tokens=1_000_000, schedule=\"constant\",\n    train_tokens=4_000_000, lora_r=16, lora_alpha=32, lora_dropout=0.0,\n    targets=[\"q_proj\", \"k_proj\", \"v_proj\", \"o_proj\"], grad_ckpt=True,\n    eval_every_tokens=1_000_000, eval_set=\"eval_small.bin\", seed=0, resume=False, save_adapter=True,\n)\n\n\ndef log(fh, **rec):\n    rec[\"t\"] = time.time()\n    line = json.dumps(rec)\n    fh.write(line + \"\\n\"); fh.flush(); print(\"RESULT \" + line, flush=True)\n\n\ndef batches(tokens, seq_len, micro_batch, rng):\n    \"\"\"Random contiguous windows from the packed, repository-ordered token stream.\"\"\"\n    n = len(tokens) - seq_len - 1\n    while True:\n        idx = rng.integers(0, n, size=micro_batch)\n        x = np.stack([tokens[i:i + seq_len + 1] for i in idx]).astype(np.int64)\n        yield torch.from_numpy(x).cuda(non_blocking=True)\n\n\n@torch.no_grad()\ndef evaluate(model, tokens, seq_len):\n    \"\"\"Mean next-token loss over the held-out set, in non-overlapping windows.\"\"\"\n    model.eval()\n    tot, cnt = 0.0, 0\n    for s in range(0, len(tokens) - 1, seq_len):\n        x = torch.from_numpy(tokens[s:s + seq_len + 1].astype(np.int64)).cuda()[None]\n        if x.shape[1] < 2: break\n        logits = model(input_ids=x[:, :-1], use_cache=False).logits.float()  # loss computed here, not by HF\n        loss = torch.nn.functional.cross_entropy(logits.view(-1, logits.size(-1)), x[:, 1:].reshape(-1), reduction=\"sum\")\n        tot += loss.item(); cnt += x.shape[1] - 1\n    model.train()\n    return tot / max(cnt, 1)\n\n\ndef lr_at(cfg, tokens_seen):\n    w = cfg[\"warmup_tokens\"]\n    if tokens_seen < w: return cfg[\"lr\"] * tokens_seen / w\n    if cfg[\"schedule\"] == \"cosine\":\n        p = min(1.0, (tokens_seen - w) / max(1, cfg[\"train_tokens\"] - w))\n        return cfg[\"lr\"] * (0.1 + 0.9 * 0.5 * (1 + math.cos(math.pi * p)))\n    return cfg[\"lr\"]  # constant after warmup: lets successive-halving rungs resume cleanly\n\n\ndef start_mem_monitor(fh, every=20):\n    \"\"\"Background thread: log process RSS, cgroup usage and CUDA memory (load-time OOM diagnosis).\"\"\"\n    import threading\n    def cg():\n        for f in (\"/sys/fs/cgroup/memory.current\", \"/sys/fs/cgroup/memory/memory.usage_in_bytes\"):\n            try: return round(int(open(f).read()) / 2**30, 1)\n            except Exception: pass\n    def rss():\n        for l in open(\"/proc/self/status\"):\n            if l.startswith(\"VmRSS\"): return round(int(l.split()[1]) / 2**20, 1)\n    def loop():\n        while True:\n            free, total = torch.cuda.mem_get_info()\n            log(fh, kind=\"mem\", rss_gib=rss(), cgroup_gib=cg(),\n                cuda_alloc_gib=round(torch.cuda.memory_allocated() / 2**30, 1),\n                device_used_gib=round((total - free) / 2**30, 1))\n            time.sleep(every)\n    threading.Thread(target=loop, daemon=True).start()\n\n\ndef drop_cache(path):\n    \"\"\"Release page cache for a file (on GB10 page cache and GPU memory share one pool).\"\"\"\n    try:\n        fd = os.open(path, os.O_RDONLY); os.posix_fadvise(fd, 0, 0, os.POSIX_FADV_DONTNEED); os.close(fd)\n    except OSError:\n        pass\n\n\ndef load_direct(path):\n    \"\"\"Load a checkpoint already in transformers' in-memory layout (see src/prep/fuse_experts.py):\n    build on meta, read each shard straight to GPU, then drop that shard's page cache.\"\"\"\n    from transformers import AutoConfig, AutoModelForCausalLM\n    from safetensors import safe_open\n    cfg = AutoConfig.from_pretrained(path)\n    with torch.device(\"meta\"):\n        model = AutoModelForCausalLM.from_config(cfg, dtype=torch.bfloat16, attn_implementation=\"sdpa\")\n    shards = sorted(set(json.load(open(os.path.join(path, \"model.safetensors.index.json\")))[\"weight_map\"].values()))\n    for f in shards: drop_cache(os.path.join(path, f))  # stale cache from earlier jobs on this node\n    loaded = set()\n    for f in shards:\n        with safe_open(os.path.join(path, f), framework=\"pt\", device=\"cuda:0\") as h:\n            sd = {k: h.get_tensor(k) for k in h.keys()}\n        model.load_state_dict(sd, strict=False, assign=True); loaded |= sd.keys(); del sd\n        drop_cache(os.path.join(path, f))\n    missing = [k for k in model.state_dict() if k not in loaded]\n    if missing: raise RuntimeError(f\"direct load missing {len(missing)} tensors, e.g. {missing[:3]}\")\n    # Non-persistent buffers (rotary inv_freq) were created on meta: rebuild them on GPU.\n    rot = model.model.rotary_emb\n    with torch.device(\"cuda:0\"):\n        model.model.rotary_emb = type(rot)(config=cfg)\n    for n, b in model.named_buffers():\n        if b.is_meta: raise RuntimeError(f\"buffer still on meta: {n}\")\n    return model\n\n\nclass RouterStats:\n    \"\"\"Counts top-k expert selections per MoE layer (router-collapse monitor).\"\"\"\n    def __init__(self, model):\n        self.counts, self.k = {}, getattr(model.config, \"num_experts_per_tok\", 8)\n        for name, m in model.named_modules():\n            if name.endswith(\"mlp.gate\") and isinstance(m, torch.nn.Linear):\n                m.register_forward_hook(self._hook(name))\n    def _hook(self, name):\n        def f(mod, inp, out):\n            idx = out.topk(self.k, dim=-1).indices.flatten()\n            c = torch.bincount(idx, minlength=out.shape[-1])\n            self.counts[name] = self.counts.get(name, 0) + c\n        return f\n    def summary(self):\n        if not self.counts: return None\n        ent = []\n        for c in self.counts.values():\n            p = c.float() / c.sum(); ent.append(float(-(p[p > 0] * p[p > 0].log()).sum() / math.log(len(p))))\n        self.counts = {}\n        return {\"router_entropy_min\": round(min(ent), 4), \"router_entropy_mean\": round(sum(ent) / len(ent), 4)}\n\n\ndef main():\n    ap = argparse.ArgumentParser(); ap.add_argument(\"--config\", required=True)\n    cfg = {**DEFAULTS, **json.load(open(ap.parse_args().config))}\n    # Data parallel across nodes (one GB10 GPU each): every rank trains on its own data stream\n    # and LoRA gradients are averaged once per step. Rank 0 evaluates, logs, and saves.\n    world, rank = int(os.environ.get(\"WORLD_SIZE\", 1)), int(os.environ.get(\"RANK\", 0))\n    dist = None\n    if world > 1:\n        import torch.distributed as dist\n        import datetime  # rank 0 evaluates alone (full eval ~6 min) while others wait at a barrier\n        dist.init_process_group(\"nccl\", timeout=datetime.timedelta(minutes=60)); torch.cuda.set_device(0)\n    os.makedirs(cfg[\"out\"], exist_ok=True)\n    fh = open(os.path.join(cfg[\"out\"], \"metrics.jsonl\") if rank == 0 else os.devnull, \"a\")\n    if rank == 0: log(fh, kind=\"config\", world_size=world, **cfg)\n    torch.manual_seed(cfg[\"seed\"]); rng = np.random.default_rng(cfg[\"seed\"] + 1000 * rank)\n\n    if rank == 0: start_mem_monitor(fh)\n    import sys; sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))\n    if cfg.get(\"fused_ce\"):\n        global fused_linear_ce\n        from fused_ce import fused_linear_ce\n    if cfg.get(\"experts_impl\") == \"triton_grouped\":  # src/kernels/grouped_gemm.py, registered with transformers\n        import grouped_gemm; grouped_gemm.register(\"triton_grouped\")\n    from transformers import AutoModelForCausalLM\n    from peft import LoraConfig, get_peft_model, PeftModel\n    t0 = time.time()\n    if cfg.get(\"loader\", \"direct\") == \"direct\" and cfg[\"model\"].endswith(\"-fused\"):\n        model = load_direct(cfg[\"model\"])\n    else:\n        model = AutoModelForCausalLM.from_pretrained(cfg[\"model\"], dtype=torch.bfloat16,\n                                                     attn_implementation=\"sdpa\", device_map={\"\": 0})\n    if cfg.get(\"experts_impl\"):  # \"eager\" (per-expert loop) | \"grouped_mm\" | \"batched_mm\" | registered custom kernel\n        model.config._experts_implementation = cfg[\"experts_impl\"]\n    log(fh, kind=\"loaded\", seconds=round(time.time() - t0, 1), loader=cfg.get(\"loader\", \"direct\"),\n        experts_impl=model.config._experts_implementation)\n    load_s = time.time() - t0\n    if cfg[\"grad_ckpt\"]:\n        model.gradient_checkpointing_enable(gradient_checkpointing_kwargs={\"use_reentrant\": False})\n        model.enable_input_require_grads()\n    adapter_dir = os.path.join(cfg[\"out\"], \"adapter\"); state_path = os.path.join(cfg[\"out\"], \"state.pt\")\n    resumed = cfg[\"resume\"] and os.path.exists(state_path)\n    if resumed:\n        model = PeftModel.from_pretrained(model, adapter_dir, is_trainable=True)\n    else:\n        model = get_peft_model(model, LoraConfig(r=cfg[\"lora_r\"], lora_alpha=cfg[\"lora_alpha\"],\n                                                 lora_dropout=cfg[\"lora_dropout\"],\n                                                 target_modules=cfg[\"targets\"], task_type=\"CAUSAL_LM\"))\n    if cfg.get(\"compile\"):  # regional torch.compile: each decoder layer, dynamic shapes (variable tokens/expert)\n        t_c = time.time()\n        for layer in model.get_base_model().model.layers:\n            layer.compile(dynamic=True)\n        log(fh, kind=\"compile\", mode=\"per-layer dynamic\", setup_s=round(time.time() - t_c, 1))\n    params = [p for p in model.parameters() if p.requires_grad]\n    opt = torch.optim.AdamW(params, lr=cfg[\"lr\"], betas=(0.9, 0.95), weight_decay=0.0)\n    tokens_seen, step = 0, 0\n    if resumed:\n        st = torch.load(state_path, weights_only=False)\n        opt.load_state_dict(st[\"opt\"]); tokens_seen, step = st[\"tokens_seen\"], st[\"step\"]\n        rng = np.random.default_rng(st[\"rng_seed\"])\n    router = RouterStats(model)\n\n    train = np.memmap(os.path.join(cfg[\"data\"], \"train.bin\"), dtype=np.uint32, mode=\"r\")\n    ev = np.fromfile(os.path.join(cfg[\"data\"], cfg[\"eval_set\"]), dtype=np.uint32)\n    n_trainable = sum(p.numel() for p in params)\n    log(fh, kind=\"setup\", load_s=round(load_s, 1), trainable_params=n_trainable, resumed=resumed,\n        train_tokens_available=int(len(train)), eval_tokens=int(len(ev)),\n        mem_gib=round(torch.cuda.memory_allocated() / 2**30, 1))\n\n    if not resumed and not cfg.get(\"skip_eval\") and rank == 0:\n        e = evaluate(model, ev, cfg[\"seq_len\"])\n        log(fh, kind=\"eval\", tokens=0, eval_loss=round(e, 5), ppl=round(math.exp(e), 4))\n    if dist: dist.barrier()\n\n    per_step = cfg[\"seq_len\"] * cfg[\"micro_batch\"] * cfg[\"grad_accum\"] * world  # cluster-wide tokens/step\n    gen = batches(train, cfg[\"seq_len\"], cfg[\"micro_batch\"], rng)\n    next_eval = (tokens_seen // cfg[\"eval_every_tokens\"] + 1) * cfg[\"eval_every_tokens\"]\n    model.train(); torch.cuda.reset_peak_memory_stats()\n    while tokens_seen < cfg[\"train_tokens\"]:\n        t = time.time(); tot = 0.0\n        for g in opt.param_groups: g[\"lr\"] = lr_at(cfg, tokens_seen)\n        for _ in range(cfg[\"grad_accum\"]):\n            x = next(gen)\n            if cfg.get(\"fused_ce\"):  # src/kernels/fused_ce.py: chunked lm_head + Triton CE, no full FP32 logits\n                base = model.get_base_model()\n                hid = base.model(input_ids=x[:, :-1], use_cache=False).last_hidden_state\n                loss = fused_linear_ce(hid.reshape(-1, hid.shape[-1]), base.lm_head.weight, x[:, 1:].reshape(-1))\n            else:\n                loss = model(input_ids=x[:, :-1], labels=x[:, :-1], use_cache=False).loss  # HF shifts labels\n            (loss / cfg[\"grad_accum\"]).backward(); tot += loss.item() / cfg[\"grad_accum\"]\n        comm_s = 0.0\n        if dist:  # one flattened all-reduce of the LoRA gradients (~13M params)\n            tc = time.time()\n            grads = [p.grad for p in params]\n            flat = torch._utils._flatten_dense_tensors(grads)\n            dist.all_reduce(flat); flat /= world\n            for g, f in zip(grads, torch._utils._unflatten_dense_tensors(flat, grads)): g.copy_(f)\n            torch.cuda.synchronize(); comm_s = time.time() - tc\n        gn = torch.nn.utils.clip_grad_norm_(params, 1.0)\n        opt.step(); opt.zero_grad(set_to_none=True)\n        torch.cuda.synchronize(); dt = time.time() - t\n        tokens_seen += per_step; step += 1\n        rec = dict(kind=\"train\", step=step, tokens=tokens_seen, loss=round(tot, 5), lr=opt.param_groups[0][\"lr\"],\n                   grad_norm=round(float(gn), 4), step_s=round(dt, 3), tok_s=round(per_step / dt, 1),\n                   peak_mem_gib=round(torch.cuda.max_memory_allocated() / 2**30, 1),\n                   world_size=world, allreduce_s=round(comm_s, 4))\n        if step % 10 == 0 or step == 1:\n            rs = router.summary()\n            if rs: rec.update(rs)\n        log(fh, **rec)\n        if not math.isfinite(tot):\n            log(fh, kind=\"abort\", reason=\"non-finite loss\"); break\n        if not cfg.get(\"skip_eval\") and (tokens_seen >= next_eval or tokens_seen >= cfg[\"train_tokens\"]):\n            if rank == 0:\n                e = evaluate(model, ev, cfg[\"seq_len\"])\n                log(fh, kind=\"eval\", tokens=tokens_seen, eval_loss=round(e, 5), ppl=round(math.exp(e), 4))\n            if dist: dist.barrier()\n            next_eval += cfg[\"eval_every_tokens\"]\n\n    if rank != 0:\n        dist.barrier(); dist.destroy_process_group(); return\n    if cfg[\"save_adapter\"]:\n        model.save_pretrained(adapter_dir)\n        torch.save({\"opt\": opt.state_dict(), \"tokens_seen\": tokens_seen, \"step\": step,\n                    \"rng_seed\": int(rng.integers(1 << 31))}, state_path)\n    summary = dict(kind=\"summary\", tokens=tokens_seen, steps=step,\n                   final_eval_loss=([json.loads(l)[\"eval_loss\"] for l in open(fh.name) if '\"kind\": \"eval\"' in l] or [None])[-1])\n    json.dump(summary, open(os.path.join(cfg[\"out\"], \"summary.json\"), \"w\"), indent=1)\n    log(fh, **summary)\n    if dist: dist.barrier(); dist.destroy_process_group()\n\n\nif __name__ == \"__main__\":\n    main()\n",
  "trial.json": "{\n \"out\": \"/runs/trials/s4-perf-triton-grouped\",\n \"compile\": true,\n \"fused_ce\": true,\n \"grad_ckpt\": false,\n \"micro_batch\": 1,\n \"grad_accum\": 8,\n \"seq_len\": 4096,\n \"train_tokens\": 262144,\n \"warmup_tokens\": 32768,\n \"skip_eval\": true,\n \"save_adapter\": false,\n \"experts_impl\": \"triton_grouped\"\n}",
  "fused_ce.py": "\"\"\"Fused linear + cross-entropy for a 152k vocabulary (Triton, tested on GB10 / sm_121).\n\nStandard path: logits = h @ W^T for all tokens (4096 x 151936), upcast to FP32 for the loss,\nthen a second FP32 tensor for its gradient: ~5 GB of temporaries per 4k-token sequence.\n\nFused path: process tokens in chunks; for each chunk compute BF16 logits, then ONE Triton\nkernel per row does an online-softmax pass (max + sum-exp) and a second pass that writes\nd(loss)/d(logits) in place over the logits buffer. The chunk's hidden-state gradient is\nthen logits_grad @ W. The lm_head is frozen under LoRA, so no weight gradient is needed.\nGradients are computed during forward (backward just scales them).\n\"\"\"\nimport torch\nimport triton\nimport triton.language as tl\n\n\n@triton.jit\ndef _ce_fwd_grad_kernel(logits_ptr, stride, targets_ptr, loss_ptr, V, scale, BLOCK: tl.constexpr):\n    row = tl.program_id(0).to(tl.int64)\n    ptr = logits_ptr + row * stride\n    t = tl.load(targets_ptr + row)\n    valid = t >= 0\n    # pass 1: online max / sum-exp over the vocabulary\n    m = float(\"-inf\")\n    d = 0.0\n    for off in range(0, V, BLOCK):\n        cols = off + tl.arange(0, BLOCK)\n        x = tl.load(ptr + cols, mask=cols < V, other=float(\"-inf\")).to(tl.float32)\n        m_new = tl.maximum(m, tl.max(x, 0))\n        d = d * tl.exp(m - m_new) + tl.sum(tl.exp(x - m_new), 0)\n        m = m_new\n    lse = m + tl.log(d)\n    xt = tl.load(ptr + tl.where(valid, t, 0)).to(tl.float32)\n    tl.store(loss_ptr + row, tl.where(valid, lse - xt, 0.0))\n    # pass 2: gradient (softmax - onehot) * scale, written in place\n    for off in range(0, V, BLOCK):\n        cols = off + tl.arange(0, BLOCK)\n        mask = cols < V\n        x = tl.load(ptr + cols, mask=mask, other=0.0).to(tl.float32)\n        g = tl.exp(x - lse)\n        g = tl.where(cols == t, g - 1.0, g) * scale\n        g = tl.where(valid, g, 0.0)\n        tl.store(ptr + cols, g.to(logits_ptr.dtype.element_ty), mask=mask)\n\n\nclass FusedLinearCE(torch.autograd.Function):\n    @staticmethod\n    def forward(ctx, h, weight, targets, chunk=1024, block=4096):\n        \"\"\"h [N, H] (bf16), weight [V, H] (bf16, frozen), targets [N] (int64, -100 = ignore).\"\"\"\n        N, V = h.shape[0], weight.shape[0]\n        n_valid = max(int((targets >= 0).sum()), 1)\n        loss = torch.empty(N, device=h.device, dtype=torch.float32)\n        dh = torch.empty_like(h) if h.requires_grad else None\n        for s in range(0, N, chunk):\n            e = min(N, s + chunk)\n            logits = h[s:e] @ weight.t()  # [c, V] bf16, reused as the gradient buffer\n            _ce_fwd_grad_kernel[(e - s,)](logits, logits.stride(0), targets[s:e].contiguous(), loss[s:e],\n                                          V, 1.0 / n_valid, BLOCK=block, num_warps=8)\n            if dh is not None:\n                dh[s:e] = logits @ weight\n            del logits\n        ctx.save_for_backward(dh)\n        return loss.sum() / n_valid\n\n    @staticmethod\n    def backward(ctx, grad):\n        (dh,) = ctx.saved_tensors\n        return dh * grad.to(dh.dtype), None, None, None, None\n\n\ndef fused_linear_ce(h, weight, targets, chunk=1024):\n    return FusedLinearCE.apply(h, weight, targets, chunk)\n\n\ndef reference_ce(h, weight, targets):\n    logits = (h @ weight.t()).float()\n    return torch.nn.functional.cross_entropy(logits, targets, ignore_index=-100)\n",
  "grouped_gemm.py": "\"\"\"Grouped expert GEMM for MoE layers (Triton; written for GB10 / sm_121, mma.sync via tl.dot).\n\nRows of X are sorted by expert; `offs` holds cumulative row ends per expert (int32, like\ntorch._grouped_mm). For each expert e:   Y[rows_e] = X[rows_e] @ B_e\n  forward  (linear):  B_e = W[e]^T   W: [E, out, in]   (Y = X W^T)\n  backward (dX only): B_e = W[e]     dX = dY W         (expert weights are frozen under LoRA)\nBoth are the same kernel with different weight strides.\n\nOne launch covers every expert: a tile table maps program id -> (expert, first row). Its size is\na fixed upper bound (ceil(S/BM) + E), built on device with searchsorted, so there is no\nGPU->CPU sync per call (hundreds of calls per training step) and it stays CUDA-graph friendly.\n\n`triton_grouped_experts_forward` mirrors transformers' `grouped_mm_experts_forward`\n(routing, sort, offsets, gate, combine) and swaps only the grouped linear. Register it with\n`register()` and select it with config._experts_implementation = \"triton_grouped\".\n\"\"\"\nimport torch\nimport triton\nimport triton.language as tl\n\nBM = 64  # rows per tile (fixed: the tile table depends on it). ~256 rows/expert -> ~4 tiles.\n\n\n@triton.autotune(\n    configs=[triton.Config({\"BN\": bn, \"BK\": bk}, num_warps=w, num_stages=s)\n             for bn in (64, 128) for bk in (32, 64) for w in (4, 8) for s in (2, 3, 4)],\n    key=[\"N\", \"K\"],\n)\n@triton.jit\ndef _grouped_gemm_kernel(X, B, Y, tile_e, tile_m0, offs, N, K, E,\n                         sxm, sxk, sbe, sbk, sbn, sym, syn,\n                         BM_: tl.constexpr, BN: tl.constexpr, BK: tl.constexpr):\n    pid_t = tl.program_id(0)\n    pid_n = tl.program_id(1)\n    e = tl.load(tile_e + pid_t)\n    if e >= E:  # padding tile of the fixed-size table\n        return\n    m0 = tl.load(tile_m0 + pid_t)\n    m_end = tl.load(offs + e)\n    rm = m0 + tl.arange(0, BM_)\n    rn = pid_n * BN + tl.arange(0, BN)\n    rk = tl.arange(0, BK)\n    m_ok = rm < m_end\n    n_ok = rn < N\n    x_ptr = X + rm[:, None] * sxm + rk[None, :] * sxk\n    b_ptr = B + e.to(tl.int64) * sbe + rk[:, None] * sbk + rn[None, :] * sbn\n    acc = tl.zeros((BM_, BN), dtype=tl.float32)\n    for k in range(0, K, BK):\n        k_ok = (k + rk) < K\n        x = tl.load(x_ptr, mask=m_ok[:, None] & k_ok[None, :], other=0.0)\n        b = tl.load(b_ptr, mask=k_ok[:, None] & n_ok[None, :], other=0.0)\n        acc += tl.dot(x, b)\n        x_ptr += BK * sxk\n        b_ptr += BK * sbk\n    y_ptr = Y + rm[:, None] * sym + rn[None, :] * syn\n    tl.store(y_ptr, acc.to(Y.dtype.element_ty), mask=m_ok[:, None] & n_ok[None, :])\n\n\ndef tile_table(offs, num_rows, num_experts):\n    \"\"\"(tile_e, tile_m0) with a fixed upper-bound length; padding tiles have expert id E.\"\"\"\n    offs = offs.to(torch.int64)\n    starts = torch.cat([offs.new_zeros(1), offs[:-1]])\n    ntiles = (offs - starts + BM - 1) // BM\n    cum = torch.cumsum(ntiles, 0)\n    max_tiles = (num_rows + BM - 1) // BM + num_experts\n    t = torch.arange(max_tiles, device=offs.device)\n    e = torch.searchsorted(cum, t, right=True)\n    e_c = e.clamp(max=num_experts - 1)\n    m0 = starts[e_c] + (t - (cum[e_c] - ntiles[e_c])) * BM\n    return e.to(torch.int32), m0.to(torch.int32)\n\n\ndef _launch(x, b_view, offs, tables, out_dim, transposed_strides):\n    E = offs.numel()\n    S, K = x.shape\n    y = torch.empty(S, out_dim, device=x.device, dtype=x.dtype)\n    te, tm = tables\n    sbe, sbk, sbn = transposed_strides\n    grid = lambda meta: (te.numel(), triton.cdiv(out_dim, meta[\"BN\"]))\n    _grouped_gemm_kernel[grid](x, b_view, y, te, tm, offs, out_dim, K, E,\n                               x.stride(0), x.stride(1), sbe, sbk, sbn, y.stride(0), y.stride(1), BM_=BM)\n    return y\n\n\nclass GroupedLinear(torch.autograd.Function):\n    \"\"\"Y = X W[e]^T per expert group. W frozen: backward returns dX only.\"\"\"\n\n    @staticmethod\n    def forward(ctx, x, weight, offs):\n        x = x.contiguous()\n        tables = tile_table(offs, x.shape[0], weight.shape[0])\n        # B_e[k, n] = W[e, n, k]\n        y = _launch(x, weight, offs, tables, weight.shape[1], (weight.stride(0), weight.stride(2), weight.stride(1)))\n        ctx.save_for_backward(weight, offs, *tables)\n        return y\n\n    @staticmethod\n    def backward(ctx, dy):\n        weight, offs, te, tm = ctx.saved_tensors\n        # dX = dY @ W[e]: B_e[k, n] = W[e, k, n] with K = out_dim, N = in_dim\n        dx = _launch(dy.contiguous(), weight, offs, (te, tm), weight.shape[2],\n                     (weight.stride(0), weight.stride(1), weight.stride(2)))\n        return dx, None, None\n\n\ndef grouped_linear(x, weight, offs):\n    assert not weight.requires_grad, \"expert weights must be frozen (LoRA); dW is not implemented\"\n    return GroupedLinear.apply(x, weight, offs)\n\n\ndef triton_grouped_experts_forward(self, hidden_states, top_k_index, top_k_weights):\n    \"\"\"Drop-in for transformers' grouped_mm_experts_forward (no bias, no expert parallelism).\"\"\"\n    num_top_k = top_k_index.size(-1)\n    num_tokens, hidden_dim = hidden_states.shape\n    sample_weights = top_k_weights.reshape(-1)\n    expert_ids = top_k_index.reshape(-1)\n    expert_ids_g, perm = torch.sort(expert_ids)\n    x_g = hidden_states[perm // num_top_k]\n    w_g = sample_weights[perm]\n    counts = torch.histc(expert_ids_g.int(), bins=self.num_experts, min=0, max=self.num_experts - 1)\n    offs = torch.cumsum(counts, dim=0, dtype=torch.int32)\n    up = self.gate_up_proj if self.has_gate else self.up_proj\n    if getattr(self, \"is_transposed\", False):  # weights stored [E, in, out]: view them as [E, out, in]\n        up = up.transpose(-2, -1)\n    h = grouped_linear(x_g, up, offs)\n    h = self._apply_gate(h) if self.has_gate else self.act_fn(h)\n    down = self.down_proj.transpose(-2, -1) if getattr(self, \"is_transposed\", False) else self.down_proj\n    out = grouped_linear(h, down, offs) * w_g.unsqueeze(-1)\n    inv = torch.empty_like(perm)\n    inv[perm] = torch.arange(perm.numel(), device=perm.device)\n    return out[inv].view(num_tokens, num_top_k, hidden_dim).sum(dim=1).to(hidden_states.dtype)\n\n\ndef register(name=\"triton_grouped\"):\n    from transformers.integrations.moe import ALL_EXPERTS_FUNCTIONS\n    ALL_EXPERTS_FUNCTIONS.register(name, triton_grouped_experts_forward)\n    return name\n"
 },
