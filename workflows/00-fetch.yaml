# workflows/00-fetch.yaml
# One-time CIQ Fuzzball v4 bootstrap workflow targeting Team 3 VAST storage (`use: team3`):
#   1. Base model weights: Qwen/Qwen3-Coder-30B-A3B (~57 GB BF16 safetensors)
#   2. Public HPC stand-in corpus: LAMMPS C++ repository (~15,605 source/doc files)
#
# Launch with:
#   fuzzball workflow validate workflows/00-fetch.yaml
#   fuzzball workflow start workflows/00-fetch.yaml --name crucible-00-fetch

version: v4

volumes:
  vast:
    name: runs
    use: team3

jobs:
  fetch-base-model:
    image:
      uri: docker://python:3.12-slim
    mounts:
      /vast:
        volume: vast
    env:
      - HF_XET_HIGH_PERFORMANCE=1
      - HOME=/tmp/home
      - PYTHONUNBUFFERED=1
    resource:
      cpu:
        cores: 8
      memory:
        size: 16GiB
    policy:
      timeout:
        execute: 6h
    script: |
      #!/bin/bash
      set -euo pipefail
      DEST="/vast/models/Qwen3-Coder-30B-A3B"
      mkdir -p "$DEST" "$HOME"
      pip install --quiet --no-cache-dir "huggingface_hub[hf_xet]>=0.34"
      if [ ! -f "$DEST/config.json" ]; then
        hf download Qwen/Qwen3-Coder-30B-A3B --local-dir "$DEST"
        rm -rf "$DEST/.cache"
      fi
      # Also stage compact 1.5B live-demo model (~3.1 GB BF16, ~20s download) for fast real-weight baseline + fine-tuning demos
      DEMO_DEST="/vast/models/Qwen/Qwen2.5-Coder-1.5B-Instruct"
      mkdir -p "$DEMO_DEST"
      if [ ! -f "$DEMO_DEST/config.json" ]; then
        hf download Qwen/Qwen2.5-Coder-1.5B-Instruct --local-dir "$DEMO_DEST"
        rm -rf "$DEMO_DEST/.cache"
      fi
      du -sh "$DEST" "$DEMO_DEST"

  fetch-lammps-source:
    image:
      uri: docker://python:3.12-slim
    mounts:
      /vast:
        volume: vast
    env:
      - REPO=lammps/lammps
      - COMMIT=68b557e3a2148ea9b31dda5b55800215fb8be677
    resource:
      cpu:
        cores: 4
      memory:
        size: 8GiB
    policy:
      timeout:
        execute: 1h
    script: |
      #!/bin/bash
      set -euo pipefail
      DEST="/vast/data/lammps"
      rm -rf "$DEST" && mkdir -p "$DEST"
      python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], '/tmp/src.tar.gz')" \
        "https://codeload.github.com/${REPO}/tar.gz/${COMMIT}"
      tar -xzf /tmp/src.tar.gz -C "$DEST" --strip-components=1
      find "$DEST" -type f | wc -l
