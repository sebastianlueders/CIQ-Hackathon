# Dev probe (stage 0): is the training stack usable on GB10 / sm_121, and how
# fast do model weights stream from VAST? Results print as JSON lines tagged
# RESULT and are copied to the runs volume under stage0/.
version: v4

files:
  probe.py: |
    import json, os, subprocess, sys, time, glob
    def out(kind, **kw):
        kw["kind"] = kind; print("RESULT " + json.dumps(kw), flush=True)
    import torch
    out("versions", torch=torch.__version__, cuda=torch.version.cuda,
        cudnn=torch.backends.cudnn.version(), python=sys.version.split()[0])
    p = torch.cuda.get_device_properties(0)
    free, total = torch.cuda.mem_get_info()
    out("gpu", name=p.name, cc=f"{p.major}.{p.minor}", sms=p.multi_processor_count,
        mem_total_gib=round(total / 2**30, 1), mem_free_gib=round(free / 2**30, 1))

    # Dense GEMM sweep: best sustained TFLOP/s for BF16 (and FP8 if supported).
    def sec(fn, iters=20):  # mean seconds per call after warm-up
        for _ in range(3): fn()
        torch.cuda.synchronize(); t = time.perf_counter()
        for _ in range(iters): fn()
        torch.cuda.synchronize(); return (time.perf_counter() - t) / iters
    def bench(fn, flops): return flops / sec(fn) / 1e12  # TFLOP/s
    for n in (2048, 4096, 8192):
        a = torch.randn(n, n, device="cuda", dtype=torch.bfloat16); b = torch.randn(n, n, device="cuda", dtype=torch.bfloat16)
        out("gemm", dtype="bf16", n=n, tflops=round(bench(lambda: a @ b, 2 * n**3), 1))
        try:
            a8, b8 = a.to(torch.float8_e4m3fn), b.to(torch.float8_e4m3fn).t().contiguous().t()
            one = torch.tensor(1.0, device="cuda")
            f = lambda: torch._scaled_mm(a8, b8, scale_a=one, scale_b=one, out_dtype=torch.bfloat16)
            out("gemm", dtype="fp8", n=n, tflops=round(bench(f, 2 * n**3), 1))
        except Exception as e:
            out("gemm", dtype="fp8", n=n, error=str(e)[:200])
    # Device memory read bandwidth (sum over a large tensor).
    x = torch.empty(2**30, device="cuda", dtype=torch.float32)  # 4 GiB
    out("membw", read_gbs=round(x.numel() * 4 / sec(lambda: x.sum()) / 1e9, 1))

    # Triton: does a trivial kernel compile and run on this arch?
    try:
        import triton, triton.language as tl
        @triton.jit
        def add(x, y, o, n, B: tl.constexpr):
            i = tl.program_id(0) * B + tl.arange(0, B); m = i < n
            tl.store(o + i, tl.load(x + i, mask=m) + tl.load(y + i, mask=m), mask=m)
        u = torch.randn(1 << 20, device="cuda"); v = torch.randn_like(u); w = torch.empty_like(u)
        add[(triton.cdiv(u.numel(), 1024),)](u, v, w, u.numel(), B=1024)
        out("triton", version=triton.__version__, ok=bool(torch.allclose(w, u + v)))
    except Exception as e:
        out("triton", ok=False, error=str(e)[:300])

    # SDPA backends available for attention.
    q = torch.randn(1, 32, 4096, 128, device="cuda", dtype=torch.bfloat16)
    from torch.nn.attention import sdpa_kernel, SDPBackend
    for be in (SDPBackend.FLASH_ATTENTION, SDPBackend.EFFICIENT_ATTENTION, SDPBackend.CUDNN_ATTENTION):
        try:
            with sdpa_kernel(be): s = sec(lambda: torch.nn.functional.scaled_dot_product_attention(q, q, q, is_causal=True), 5)
            out("sdpa", backend=be.name, ok=True, ms=round(s * 1e3, 2))
        except Exception as e:
            out("sdpa", backend=be.name, ok=False, error=str(e)[:150])

  read.py: |
    # Stream every safetensors shard of the base model from VAST, timing throughput.
    import glob, json, os, time
    d = os.environ["MODEL_DIR"]; files = sorted(glob.glob(f"{d}/*.safetensors"))
    tot, t0 = 0, time.perf_counter()
    for f in files:
        with open(f, "rb", buffering=0) as fh:
            while (b := fh.read(64 << 20)): tot += len(b)
    dt = time.perf_counter() - t0
    print("RESULT " + json.dumps({"kind": "vast_read", "files": len(files), "gib": round(tot / 2**30, 1),
                                  "seconds": round(dt, 1), "gbs": round(tot / dt / 1e9, 2)}), flush=True)

jobs:
  env:
    image:
      uri: docker://nvcr.io/nvidia/pytorch:26.10-py3
    env:
      - VENV=/envs/train-pt2610
      - HOME=/tmp/home
      - PIP_CACHE_DIR=/envs/cache/pip
    files:
      /opt/probe.py: file://probe.py
    mounts:
      /envs: {volume: envs}
      /runs: {volume: runs}
    policy:
      timeout: {execute: 1h}
    resource:
      cpu: {cores: 16}
      memory: {size: 100GiB}
      devices: {nvidia.com/gpu: 1}
    script: |
      #!/bin/bash
      set -uo pipefail
      mkdir -p /runs/stage0 "$HOME"
      nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      python /opt/probe.py 2>&1 | tee /runs/stage0/env-probe.log
      # Training libs in a venv on the shared envs volume, layered over the image's torch.
      [ -d "$VENV" ] || python -m venv --system-site-packages "$VENV"
      "$VENV/bin/pip" install --quiet "transformers>=4.57" "peft>=0.17" "accelerate>=1.10" safetensors 2>&1 | tail -3
      "$VENV/bin/python" -c "import json,transformers,peft,torch;print('RESULT '+json.dumps({'kind':'venv','transformers':transformers.__version__,'peft':peft.__version__,'torch':torch.__version__}))" \
        | tee -a /runs/stage0/env-probe.log

  vast-read:
    image:
      uri: docker://python:3.12-slim
    env:
      - MODEL_DIR=/models/Qwen/Qwen3-Coder-30B-A3B-Instruct
    files:
      /opt/read.py: file://read.py
    mounts:
      /models: {volume: models}
      /runs: {volume: runs}
    policy:
      timeout: {execute: 1h}
    resource:
      cpu: {cores: 4}
      memory: {size: 8GiB}
    script: |
      #!/bin/bash
      mkdir -p /runs/stage0
      python3 /opt/read.py | tee /runs/stage0/vast-read.log

volumes:
  envs: {name: envs, use: team3}
  runs: {name: runs, use: team3}
  models: {name: models, use: team3}
