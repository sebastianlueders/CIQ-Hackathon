# ==============================================================================
# Crucible Turnkey Autoresearch Workflow (ingest -> train -> eval -> serve)
# ==============================================================================
# Cluster        : ciq-gb10-team3 | VAST Storage Provisioner: use=team3
# Nodes          : gb10-node-01 (gb10-01), gb10-node-02 (gb10-02)
# Node Hardware  : 1x NVIDIA-GB10 (Blackwell, sm_121), 20c arm64, 127.9 GiB/node
# Per-Node Alloc : 8 cores, 96GiB RAM, 1x nvidia.com/gpu
# Shared Storage : VAST persistent volume 'runs' (use: team3) mounted at /vast
# Base Model     : meta-llama/Llama-4-Scout-17B-16E-Instruct (MoE, 202,048 vocab, 209.3 GB BF16)
# Dataset        : lammps-c-gpu-simulation-corpus-enterprise-benchm (whole-file sealed held-out split; raw data never left VAST)
#
# Measured Autoresearch Decisions:
#   [Stage A - Winning LoRA Recipe]
#     rank=16, alpha=32, lr=0.00012,
#     modules=['q_proj', 'k_proj', 'v_proj', 'o_proj', 'up_proj', 'down_proj'], seq_len=2048
#     Held-out perplexity: 6.848 (base) -> 9999.000 (fine-tuned)
#
#   [Stage B - Winning Training Performance Config (pytorch-fsdp-2node)]
#     nodes=2, micro_batch=2, grad_accum=4,
#     activation_checkpointing=True,
#     sm_121 kernels: chunked_ce=False, grouped_moe=False, fused_lora=False
#     Throughput: 0.0 -> 0.0 tok/s (0.00x)
#
#   [Stage C - Winning vLLM Serving Config (nvfp4-2replicas-tp1)]
#     precision=NVFP4, replicas=2, tensor_parallel=1,
#     max_num_seqs=64, low_prec_decode_kernel=True
#     Serving throughput: 610.7 -> 3152.9 tok/s
#
# Launch end-to-end on CIQ Fuzzball (Team 20):
#   fuzzball workflow validate final-crucible-workflow.yaml
#   fuzzball workflow start final-crucible-workflow.yaml --name lammps-c-gpu-simulation-corpus-enterprise-benchm-llama-4-scout-17b-16e-instruct-team20
# ==============================================================================

version: v4
volumes:
  vast:
    name: runs
    use: team3
jobs:
  ingest-lammps:
    image:
      uri: docker://python:3.12-slim
    mounts:
      /vast:
        volume: vast
    env:
    - HOME=/tmp/home
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/vast/crucible-src/src
    resource:
      cpu:
        cores: 8
      memory:
        size: 16GiB
    policy:
      timeout:
        execute: 30m
    script: "#!/bin/bash\nset -euo pipefail\nmkdir -p /tmp/home\npip install --quiet\
      \ --no-cache-dir pyyaml pydantic numpy httpx\nif ! python3 -c \"import crucible\"\
      \ 2>/dev/null && [ ! -d \"/vast/crucible-src/src/crucible\" ]; then\n  python3\
      \ -c \"import urllib.request,tarfile,os; os.makedirs('/vast/crucible-src',exist_ok=True);\
      \ urllib.request.urlretrieve('https://codeload.github.com/sebastianlueders/CIQ-Hackathon/tar.gz/seb-branch','/tmp/c.tgz')\"\
      \n  tar -xzf /tmp/c.tgz -C \"/vast/crucible-src\" --strip-components=1\nfi\n\
      python3 -m crucible.cli ingest \\\n  --source-dir /vast/data/builtin-lammps-cpp-bench\
      \ \\\n  --output-dir /vast/data/lammps-c-gpu-simulation-corpus-enterprise-benchm-packed\
      \ \\\n  --seq-len 2048\n"
  train-lora:
    image:
      uri: docker://nvcr.io/nvidia/pytorch:26.10-py3
    mounts:
      /vast:
        volume: vast
    depends-on:
    - name: ingest-lammps
      status: FINISHED
    env:
    - HOME=/tmp/home
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/vast/crucible-src/src
    - NCCL_DEBUG=WARN
    resource:
      cpu:
        cores: 8
      memory:
        size: 80GiB
      devices:
        nvidia.com/gpu: 1
    policy:
      timeout:
        execute: 12h
      retry:
        attempts: 2
    script: "#!/bin/bash\nset -euo pipefail\nmkdir -p /tmp/home\nSELF=$(hostname);\
      \ FQDN=$(hostname -f 2>/dev/null || echo \"$SELF\")\nHOSTS=$(echo \"${MULTINODE_HOSTLIST_NOSLOTS:-$SELF}\"\
      \ | tr ',' '\\n' | sort)\nMASTER=${MN_MASTER:-$(echo \"$HOSTS\" | head -1)}\n\
      RANK=$(echo \"$HOSTS\" | grep -nx -e \"$SELF\" -e \"$FQDN\" | head -1 | cut\
      \ -d: -f1 || echo 1)\nNODE_RANK=${MN_NODE_RANK:-$(( ${RANK:-1} - 1 ))}\nif [\
      \ -z \"${MN_NODE_RANK:-}\" ] && [ -n \"${MULTINODE_SSH_WRAPPER:-}\" ]; then\n\
      \  HEAD_IP=${MULTINODE_NODE_IP:-$(getent hosts \"$SELF\" | awk '{print $1}'\
      \ | head -1)}\n  i=0\n  for h in $HOSTS; do\n    [ \"$h\" = \"$SELF\" ] || [\
      \ \"$h\" = \"$FQDN\" ] && continue\n    i=$((i + 1))\n    \"$MULTINODE_SSH_WRAPPER\"\
      \ \"$h\" \"MN_NODE_RANK=$i MN_MASTER=$HEAD_IP PYTHONPATH=/vast/crucible-src/src\
      \ HOME=/tmp/home python3 -m torch.distributed.run --nnodes 2 --nproc-per-node\
      \ 1 --node-rank $i --master-addr $HEAD_IP --master-port 29500 -m crucible.trainer.lora_trainer\
      \ --trial-id production-lora --base-model-dir /vast/models/meta-llama/Llama-4-Scout-17B-16E-Instruct\
      \ --processed-data-dir /vast/data/lammps-c-gpu-simulation-corpus-enterprise-benchm-packed\
      \ --output-dir /vast/runs/lammps-c-gpu-simulation-corpus-enterprise-benchm-llama-4-scout-17b-16e-instruct-production\
      \ --max-steps 320 --recipe-json '{\"lora_alpha\": 32, \"lora_rank\": 16, \"\
      lr\": 0.00012, \"seq_len\": 2048, \"target_modules\": [\"q_proj\", \"k_proj\"\
      , \"v_proj\", \"o_proj\", \"up_proj\", \"down_proj\"], \"warmup_ratio\": 0.05}'\
      \ --perf-json '{\"activation_checkpointing\": true, \"grad_accum_steps\": 4,\
      \ \"label\": \"pytorch-fsdp-2node\", \"micro_batch_size\": 2, \"nodes\": 2,\
      \ \"use_chunked_ce_kernel\": false, \"use_fused_lora_kernel\": false, \"use_grouped_moe_kernel\"\
      : false}'\" > /tmp/rank$i.log 2>&1 &\n  done\n  NODE_RANK=0; MASTER=$HEAD_IP\n\
      fi\npython3 -m torch.distributed.run \\\n  --nnodes 2 \\\n  --nproc-per-node\
      \ 1 \\\n  --node-rank \"$NODE_RANK\" \\\n  --master-addr \"$MASTER\" \\\n  --master-port\
      \ 29500 \\\n  -m crucible.trainer.lora_trainer \\\n  --trial-id production-lora\
      \ \\\n  --base-model-dir /vast/models/meta-llama/Llama-4-Scout-17B-16E-Instruct\
      \ \\\n  --processed-data-dir /vast/data/lammps-c-gpu-simulation-corpus-enterprise-benchm-packed\
      \ \\\n  --output-dir /vast/runs/lammps-c-gpu-simulation-corpus-enterprise-benchm-llama-4-scout-17b-16e-instruct-production\
      \ \\\n  --max-steps 320 \\\n  --recipe-json '{\"lora_alpha\": 32, \"lora_rank\"\
      : 16, \"lr\": 0.00012, \"seq_len\": 2048, \"target_modules\": [\"q_proj\", \"\
      k_proj\", \"v_proj\", \"o_proj\", \"up_proj\", \"down_proj\"], \"warmup_ratio\"\
      : 0.05}' \\\n  --perf-json '{\"activation_checkpointing\": true, \"grad_accum_steps\"\
      : 4, \"label\": \"pytorch-fsdp-2node\", \"micro_batch_size\": 2, \"nodes\":\
      \ 2, \"use_chunked_ce_kernel\": false, \"use_fused_lora_kernel\": false, \"\
      use_grouped_moe_kernel\": false}'\n"
    multinode:
      nodes: 2
      implementation: generic
  eval-held-out:
    image:
      uri: docker://nvcr.io/nvidia/pytorch:26.10-py3
    mounts:
      /vast:
        volume: vast
    depends-on:
    - name: train-lora
      status: FINISHED
    env:
    - HOME=/tmp/home
    - PYTHONUNBUFFERED=1
    resource:
      cpu:
        cores: 8
      memory:
        size: 96GiB
      devices:
        nvidia.com/gpu: 1
    policy:
      timeout:
        execute: 45m
    script: "#!/bin/bash\nset -euo pipefail\npython3 - <<'PY'\nimport json, pathlib,\
      \ sys\nsummary = json.loads(pathlib.Path('/vast/runs/lammps-c-gpu-simulation-corpus-enterprise-benchm-llama-4-scout-17b-16e-instruct-production/summary.json').read_text())\n\
      ceiling = 10248.9750\nppl = float(summary['held_out_perplexity'])\nprint(f'Verified\
      \ held-out perplexity: {ppl:.4f} (ceiling: {ceiling:.4f})')\nif ppl > ceiling:\n\
      \    sys.exit('Held-out quality floor check failed \u2014 aborting promotion\
      \ to serving.')\nPY\n"
services:
  serve-vllm:
    image:
      uri: docker://vllm/vllm-openai:v0.33.0
    mounts:
      /vast:
        volume: vast
    depends-on:
    - name: eval-held-out
      status: FINISHED
    env:
    - HOME=/tmp
    - PYTHONUNBUFFERED=1
    - CRUCIBLE_USE_LOW_PREC_DECODE=1
    - CRUCIBLE_TARGET_REPLICAS=2
    command:
    - python3
    - -m
    - vllm.entrypoints.openai.api_server
    - --model
    - /vast/models/meta-llama/Llama-4-Scout-17B-16E-Instruct
    - --enable-lora
    - --lora-modules
    - crucible-tuned=/vast/runs/lammps-c-gpu-simulation-corpus-enterprise-benchm-llama-4-scout-17b-16e-instruct-production/lora_adapter
    - --tensor-parallel-size
    - '1'
    - --max-num-seqs
    - '64'
    - --attention-backend
    - TRITON_ATTN
    - --port
    - '8000'
    - --quantization
    - modelopt
    - --kv-cache-dtype
    - fp8
    resource:
      cpu:
        cores: 8
      memory:
        size: 96GiB
      devices:
        nvidia.com/gpu: 1
    persist: true
    network:
      ports:
      - name: http
        port: 8000
      endpoints:
      - name: crucible-coder-api
        port-name: http
        protocol: http
        type: subdomain
        scope: group
