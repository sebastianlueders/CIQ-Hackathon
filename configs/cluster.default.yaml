# Team 20 live CIQ Fuzzball cluster configuration
# Provisioner definitionId: team20
# Nodes:
#   - CIQ-CHI-SPARK39 (192.168.99.48/7331) — 1x NVIDIA-GB10 (sm_121), 20c cpu/arm64/sve, 127.9 GiB
#   - CIQ-CHI-SPARK40 (192.168.99.49/7331) — 1x NVIDIA-GB10 (sm_121), 20c cpu/arm64/sve, 127.9 GiB
# Team total: 2x nvidia.com/gpu, 40 cores, 255.8 GiB

cluster_name: ciq-gb10-team20
definition_id: team20
pin_definition_annotation: true
fuzzfile_version: v4

nodes:
  count: 2
  gpu_model: "NVIDIA GB10"
  gpu_product: "NVIDIA-GB10"
  gpu_arch: "Blackwell"
  sm_arch: "sm_121"
  arch_device: "cpu/arm64/sve"
  gpus_per_node: 1
  physical_cores_per_node: 20
  cpu_cores_per_node: 16
  physical_memory_gib_per_node: 127.9
  memory_gb_per_node: 112
  measured_peak_bf16_tflops: 198.0
  measured_peak_train_tok_s_per_node: 4150.0
  interconnect: "NCCL-RoCE-200GbE"
  inventory:
    - hostname: "CIQ-CHI-SPARK39"
      node_id: "192.168.99.48/7331"
      address: "192.168.99.48"
      status: "READY"
      gpu_product: "NVIDIA-GB10"
      gpus: 1
      cores: 20
      memory_gib: 127.9
    - hostname: "CIQ-CHI-SPARK40"
      node_id: "192.168.99.49/7331"
      address: "192.168.99.49"
      status: "READY"
      gpu_product: "NVIDIA-GB10"
      gpus: 1
      cores: 20
      memory_gib: 127.9

vast:
  volume_key: vast-shared
  persistent_volume_name: crucible-vast
  provisioner: vast
  mount_path: /vast
  models_dir: /vast/models
  datasets_dir: /vast/data
  runs_dir: /vast/runs
  object_cache_scope: user
  egress_metrics_to_object_cache: true

images:
  # Multi-arch linux/arm64 NGC images verified for Grace Blackwell GB10 (CUDA 13.2 + sm_121)
  fetch: "docker://nvcr.io/nvidia/pytorch:26.03-py3"
  train: "docker://nvcr.io/nvidia/pytorch:26.03-py3"
  serve: "docker://nvcr.io/nvidia/vllm:26.04-py3"
