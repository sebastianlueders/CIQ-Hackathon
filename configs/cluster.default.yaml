# Team 20 live CIQ Fuzzball cluster configuration
# VAST storage provisioner (`use:`): team20
# Nodes:
#   - CIQ-CHI-SPARK39 (192.168.99.48/7331) — 1x NVIDIA-GB10 (sm_121), 20c arm64, 127.9 GiB
#   - CIQ-CHI-SPARK40 (192.168.99.49/7331) — 1x NVIDIA-GB10 (sm_121), 20c arm64, 127.9 GiB
# Team total: 2x nvidia.com/gpu, 40 cores, 255.8 GiB

cluster_name: ciq-gb10-team20
definition_id: team20
pin_definition_annotation: false
fuzzfile_version: v4

nodes:
  count: 2
  gpu_model: "NVIDIA GB10"
  gpu_product: "NVIDIA-GB10"
  gpu_arch: "Blackwell"
  sm_arch: "sm_121"
  arch_device: ""
  gpus_per_node: 1
  physical_cores_per_node: 20
  cpu_cores_per_node: 16
  physical_memory_gib_per_node: 127.9
  memory_gb_per_node: 112
  measured_peak_bf16_tflops: 198.0
  measured_peak_train_tok_s_per_node: 4150.0
  interconnect: "NCCL-RoCE-200GbE"
  inventory:
    - hostname: "CIQ-CHI-SPARK39"
      node_id: "192.168.99.48/7331"
      address: "192.168.99.48"
      status: "READY"
      gpu_product: "NVIDIA-GB10"
      gpus: 1
      cores: 20
      memory_gib: 127.9
    - hostname: "CIQ-CHI-SPARK40"
      node_id: "192.168.99.49/7331"
      address: "192.168.99.49"
      status: "READY"
      gpu_product: "NVIDIA-GB10"
      gpus: 1
      cores: 20
      memory_gib: 127.9

vast:
  volume_key: vast
  persistent_volume_name: crucible-vast
  provisioner: team20
  ephemeral: false
  ephemeral_size: 64GiB
  mount_path: /vast
  models_dir: /vast/models
  datasets_dir: /vast/data
  runs_dir: /vast/runs
  object_cache_scope: user
  egress_metrics_to_object_cache: false

images:
  # Pre-cached container images on CIQ hackathon GB10 nodes (instant start, 0s pull)
  fetch: "docker://python:3.12-slim"
  train: "docker://nvcr.io/nvidia/pytorch:26.10-py3"
  serve: "docker://vllm/vllm-openai:v0.33.0"
