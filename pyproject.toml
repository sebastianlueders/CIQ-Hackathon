[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alchemy"
version = "0.1.0"
description = "Alchemy: Privacy-preserving autoresearch and sm_121 performance-engineering agent for local fine-tuning and serving on CIQ Fuzzball, VAST Data, and NVIDIA GB10."
readme = "README.md"
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
gpu = [
    "torch>=2.4",
    "triton>=3.1",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "safetensors>=0.4",
]
test = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
alchemy = "crucible.cli:main"
crucible = "crucible.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
